        body {
            background-color: #1e1e1e;
            color: #f4f4f4;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        h2 {
            text-align: center;
            color: #e2c073;
        }
        /* Contenedor principal que permite el desplazamiento horizontal */
        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 20px 10px;
            scroll-behavior: smooth;
        }
        /* Estética de la barra de desplazamiento */
        .scroll-container::-webkit-scrollbar {
            height: 10px;
        }
        .scroll-container::-webkit-scrollbar-track {
            background: #2c2c2c;
            border-radius: 5px;
        }
        .scroll-container::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 5px;
        }
        .scroll-container::-webkit-scrollbar-thumb:hover {
            background: #e2c073;
        }
        /* Estilo de cada tarjeta de imagen */
        .item-card {
            flex: 0 0 300px; /* Ancho fijo para cada tarjeta */
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        img {
            width: 100%;
            border-radius: 6px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
