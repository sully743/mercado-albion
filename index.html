<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Objetos de Albion</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #f4f4f4;
            padding: 20px;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        h2 {
            text-align: center;
            color: #e2c073;
        }
        /* Contenedor en cuadrícula que fluye hacia abajo */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 0;
        }
        /* Tarjetas individuales */
        .item-card {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .item-card:hover {
            transform: scale(1.02);
            border-color: #e2c073;
        }
        .item-card img {
            width: 100%;
            border-radius: 6px;
            object-fit: cover;
            display: block;
        }

        /* Estilo para la ventana flotante (Modal / Lightbox) */
        .modal {
            display: none; /* Oculto por defecto */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #f4f4f4;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #e2c073;
        }
    </style>
</head>
<body>

    <h2>Galería de Objetos</h2>

    <div class="grid-container" id="galeria"></div>
