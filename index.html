<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado de Objetos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f4f4f4;
            padding: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item-card {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .item-image {
            width: 100%;
            border-radius: 4px;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .item-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #e2c073;
            margin: 0 0 10px 0;
        }
        .item-stats {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            font-size: 0.9em;
            flex-grow: 1;
        }
        .item-stats li {
            margin-bottom: 6px;
        }
        .item-price {
            font-size: 1.4em;
            font-weight: bold;
            color: #4caf50;
            text-align: right;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #e2c073;">Catálogo de Armas</h2>

    <!-- Contenedor vacío esperando los datos -->
    <div class="grid-container" id="catalogo">
        
    </div>

</body>
</html>
