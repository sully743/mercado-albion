<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado de Objetos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f4f4f4;
            padding: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item-card {
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .item-image {
            width: 100%;
            border-radius: 4px;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .item-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #e2c073;
            margin: 0 0 10px 0;
        }
        .item-stats {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            font-size: 0.9em;
            flex-grow: 1;
        }
        .item-stats li {
            margin-bottom: 6px;
        }
        .item-price {
            font-size: 1.4em;
            font-weight: bold;
            color: #4caf50;
            text-align: right;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #e2c073;">Catálogo de Armas</h2>

    <!-- Contenedor donde aparecerán las tarjetas -->
    <div class="grid-container" id="catalogo"></div>

    <script>
        // Aquí guardas la información de todas tus armas
        const inventario = [
            {
                nombre: "Arco largo del iniciado (T4)",
                // IMPORTANTE: Asegúrate de que este nombre sea EXACTAMENTE el de tu imagen
                imagen: "imagenes/Captura de pantalla 2026-09-04 141051.png", 
                stats: ["💥 +9.38% Daño de habilidad", "🌿 +6.84% Curación recibida", "🛡️ +56.21 Poder de objeto"],
                precio: "3m Plata"
            },
            {
                nombre: "Otra Arma de Ejemplo",
                imagen: "imagenes/Captura de pantalla 2026-09-04 141058.png", 
                stats: ["⚔️ +15% Daño físico", "🛡️ +70 Poder de objeto"],
                precio: "5.5m Plata"
            }
        ];

        // Este código dibuja las tarjetas automáticamente
        const contenedor = document.getElementById('catalogo');
        
        inventario.forEach(arma => {
            let statsHTML = '';
            arma.stats.forEach(stat => {
                statsHTML += `<li>${stat}</li>`;
            });

            const tarjetaHTML = `
                <div class="item-card">
                    <img src="${arma.imagen}" alt="${arma.nombre}" class="item-image">
                    <h3 class="item-title">${arma.nombre}</h3>
                    <ul class="item-stats">
                        ${statsHTML}
                    </ul>
                    <div class="item-price">${arma.precio}</div>
                </div>
            `;
            contenedor.innerHTML += tarjetaHTML;
        });
    </script>

</body>
</html>
