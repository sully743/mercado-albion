<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Objetos</title>
    <style>
        body {
            background-color: #1e1e1e;
            padding: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="grid-container" id="galeria"></div>

    <script>
        // Escribe aquí los nombres EXACTOS de tus imágenes
        const imagenes = [
            "imagenes/Captura de pantalla 2026-09-04 141051.png",
            "imagenes/Captura de pantalla 2026-09-04 141058.png",
            "imagenes/Captura de pantalla 2026-09-04 141105.png"
            // Puedes agregar más abajo, siempre entre comillas y separadas por una coma
        ];

        const contenedor = document.getElementById('galeria');
        
        imagenes.forEach(ruta => {
            contenedor.innerHTML += `<img src="${ruta}">`;
        });
    </script>

</body>
</html>
