<!-- Contenedor donde aparecerán las tarjetas -->
    <div class="grid-container" id="catalogo"></div>

    <script>
        // Aquí guardas la información de todas tus armas
        const inventario = [
            {
                nombre: "Arco largo del iniciado (T4)",
                // IMPORTANTE: Pon el nombre exacto de tu captura aquí
                imagen: "imagenes/Captura de pantalla 2026-09-04 141051.png", 
                stats: ["💥 +9.38% Daño de habilidad", "🌿 +6.84% Curación recibida", "🛡️ +56.21 Poder de objeto"],
                precio: "3m Plata"
            },
            {
                nombre: "Otra Arma de Ejemplo",
                imagen: "imagenes/Captura de pantalla 2026-09-04 141058.png", 
                stats: ["⚔️ +15% Daño físico", "🛡️ +70 Poder de objeto"],
                precio: "5.5m Plata"
            }
        ];

        // Este código dibuja las tarjetas automáticamente
        const contenedor = document.getElementById('catalogo');
        
        inventario.forEach(arma => {
            let statsHTML = '';
            arma.stats.forEach(stat => {
                statsHTML += `<li>${stat}</li>`;
            });

            const tarjetaHTML = `
                <div class="item-card">
                    <img src="${arma.imagen}" alt="${arma.nombre}" class="item-image">
                    <h3 class="item-title">${arma.nombre}</h3>
                    <ul class="item-stats">
                        ${statsHTML}
                    </ul>
                    <div class="item-price">${arma.precio}</div>
                </div>
            `;
            contenedor.innerHTML += tarjetaHTML;
        });
    </script>
